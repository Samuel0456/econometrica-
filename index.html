<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Econométrica PYME — Inteligencia comercial y analista financiero virtual</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
  --navy:#0b2530;--navy2:#123747;--green:#0b7a63;--green2:#14a37f;--mint:#e7f5f0;
  --gold:#f2b233;--bg:#f4f7f6;--card:#ffffff;--ink:#13232b;--muted:#607278;
  --line:#dbe5e2;--red:#c74735;--amber:#d97706;--shadow:0 12px 35px rgba(11,37,48,.08)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer;transition:.15s ease}
.hidden{display:none!important}
a{text-decoration:none;color:inherit}

/* LAYOUT PRINCIPAL Y SIDEBAR CORREGIDO */
.app{display:grid;grid-template-columns:265px 1fr;min-height:100vh}
.sidebar{
  background:var(--navy);color:#dce9e7;padding:16px 14px;
  display:flex;flex-direction:column;gap:12px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent;
  z-index:20;
}
.sidebar::-webkit-scrollbar{width:5px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:99px}

.logo{display:flex;gap:10px;align-items:center;color:#fff;font-weight:800;font-size:18px;flex-shrink:0}
.logo-mark{width:36px;height:36px;border-radius:10px;background:var(--green2);display:grid;place-items:center;color:#fff;font-weight:900;flex-shrink:0}
.logo small{display:block;color:var(--gold);font-size:9px;letter-spacing:.14em}

.demo-switcher{padding:10px 12px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(255,255,255,.05);flex-shrink:0}
.demo-switcher-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);font-weight:800;margin-bottom:6px}
.demo-switcher select{width:100%;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:#081b24;color:#fff;padding:7px 8px;font-size:12px;font-weight:600;outline:none}
.demo-switcher select:focus{border-color:var(--green2)}

.biz{padding:10px 12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);border-radius:12px;flex-shrink:0}
.biz small{color:#8ca8a8;text-transform:uppercase;font-size:9px;letter-spacing:.12em}
.biz b{display:block;color:#fff;margin-top:2px;font-size:13px}

.nav{display:grid;gap:3px;flex-shrink:0}
.nav button{border:0;background:transparent;color:#b7cdca;padding:8px 11px;border-radius:9px;text-align:left;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:500}
.nav button:hover,.nav button.active{background:#116b5c;color:#fff}
.nav button.active{box-shadow:inset 3px 0 var(--gold);font-weight:700}

.side-bottom{margin-top:auto;border:1px solid rgba(242,178,51,.25);background:rgba(242,178,51,.08);border-radius:12px;padding:11px;color:#e8e0c9;flex-shrink:0;font-size:12px}
.side-bottom b{color:#fff;display:block;margin-bottom:2px}
.side-bottom button{margin-top:8px;border:0;border-radius:8px;padding:7px 10px;background:var(--gold);color:var(--navy);font-weight:800;width:100%;font-size:12px}

main{min-width:0;display:flex;flex-direction:column}
.top{min-height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 24px;position:sticky;top:0;z-index:15;gap:12px;flex-wrap:wrap}
.crumb{color:var(--muted);font-size:11px}
.top h1{margin:1px 0 0;font-size:19px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.content{padding:22px 24px 60px;max-width:1480px;width:100%;margin:0 auto}

.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;font-weight:700;color:var(--ink);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--green);background:#f9fbfa}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:#096350}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.whatsapp{background:#128C7E;border-color:#128C7E;color:#fff}
.btn.whatsapp:hover{background:#075E54}
.btn.danger{color:var(--red);border-color:#f3c6c0}
.btn.sm{padding:5px 9px;font-size:12px}

.notice{padding:10px 14px;background:#fff8e6;border:1px solid #f0d78b;border-radius:10px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.screen{display:grid;gap:16px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.wide{grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr)}

.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 2px 6px rgba(11,37,48,.02)}
.card h2,.card h3{margin:0}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.muted{color:var(--muted)}
.eyebrow{text-transform:uppercase;letter-spacing:.11em;font-size:10px;color:var(--muted);font-weight:800;display:block}
.kpi{min-height:116px;display:flex;flex-direction:column;justify-content:space-between}
.kpi .value{font-size:25px;font-weight:900;margin:6px 0 2px}
.delta{font-size:11px;font-weight:800}
.up{color:var(--green)}
.down{color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:99px;background:var(--mint);color:var(--green);font-size:11px;font-weight:800}
.pill.warn{background:#fff3d8;color:#946200}
.pill.red{background:#ffe8e5;color:var(--red)}
.pill.blue{background:#e0f2fe;color:#0369a1}

.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px;max-height:460px}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:13px}
th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:#f6f9f8;position:sticky;top:0;z-index:2}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr:hover td{background:#fafcfb}

.bar-list{display:grid;gap:11px}
.bar-row{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;align-items:center;font-size:13px}
.track{height:10px;background:#edf2f0;border-radius:99px;overflow:hidden}
.fill{height:100%;background:var(--green);border-radius:99px}
.chart{height:235px;width:100%;display:block}
.chart-container{position:relative;height:270px;width:100%;margin-top:10px}

.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:grid;gap:5px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
.field input[type="range"]{padding:0;accent-color:var(--green);cursor:pointer}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
.empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed #b8cbc6;border-radius:12px}

.insight{padding:12px 14px;border-radius:11px;background:#f3f8f6;border-left:4px solid var(--green);font-size:13px;line-height:1.45}
.insight.warn{background:#fff8e6;border-color:var(--gold)}
.insight.red{background:#fff0ed;border-color:var(--red)}

/* HERO & LANDING */
.hero{background:linear-gradient(135deg,#0b2530 0%,#0b7a63 100%);color:#fff;border-radius:18px;padding:30px;display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center}
.hero h2{font-size:clamp(26px,3.5vw,40px);line-height:1.08;margin:8px 0 12px}
.hero p{color:#d6e7e4;max-width:640px;font-size:15px;margin:0}
.hero-actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
.hero-visual{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);border-radius:15px;padding:14px}
.mini-dash{background:#fff;color:var(--ink);border-radius:11px;padding:14px}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.mini-box{background:#f3f7f5;border-radius:8px;padding:9px}
.mini-box b{display:block;font-size:15px}
.landing{display:grid;gap:22px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.step{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px}
.step span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--mint);color:var(--green);font-weight:900;margin-bottom:10px}

/* VIDEO INTERACTIVO SIMULADO */
.video-player{background:var(--navy);color:#fff;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.12);box-shadow:var(--shadow)}
.video-top{padding:12px 18px;background:rgba(0,0,0,.25);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap;gap:8px}
.video-dots{display:flex;gap:6px;align-items:center}
.video-dots i{width:10px;height:10px;border-radius:50%;display:inline-block}
.video-stage{padding:24px;min-height:290px;display:grid;grid-template-columns:1fr 1.15fr;gap:22px;align-items:center;background:radial-gradient(circle at top right,#134e4a,#0b2530 70%)}
.video-Mock{background:#fff;color:var(--ink);border-radius:12px;padding:16px;box-shadow:0 12px 30px rgba(0,0,0,.25);min-height:210px;display:flex;flex-direction:column;justify-content:center}
.video-controls{padding:12px 18px;background:#081b24;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.step-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.step-tab{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#b7cdca;padding:7px 10px;border-radius:8px;font-size:11px;font-weight:700;text-align:left}
.step-tab.active{background:var(--green2);color:#fff;border-color:var(--green2)}

/* WHATSAPP PREVIEW */
.wa-phone{background:#e5ddd5;border-radius:16px;overflow:hidden;border:6px solid #1f2937;max-width:420px;margin:0 auto;box-shadow:var(--shadow)}
.wa-header{background:#075E54;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.wa-avatar{width:36px;height:36px;border-radius:50%;background:var(--green2);display:grid;place-items:center;font-weight:900}
.wa-body{padding:14px;display:grid;gap:10px;max-height:420px;overflow-y:auto}
.wa-bubble{background:#fff;padding:11px 13px;border-radius:0 12px 12px 12px;font-size:12.5px;line-height:1.45;color:#111;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.wa-time{display:block;text-align:right;font-size:10px;color:#667781;margin-top:4px}

/* MODAL Y NAVEGACIÓN MÓVIL MEJORADA */
.modal{position:fixed;inset:0;background:rgba(5,24,31,.68);z-index:50;display:grid;place-items:center;padding:16px}
.modal-card{background:#fff;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:17px;padding:22px;box-shadow:var(--shadow)}
.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.close{border:0;background:#edf2f0;border-radius:8px;width:34px;height:34px;font-size:18px;font-weight:700}

.mobile-nav{display:none}
.mobile-Demo-bar{display:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(15px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:60;font-weight:700;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:1080px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .hero,.wide,.video-stage{grid-template-columns:1fr}
}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .mobile-Demo-bar{display:flex;background:var(--navy);color:#fff;padding:8px 15px;justify-content:space-between;align-items:center;gap:10px;font-size:12px}
  .mobile-Demo-bar select{background:#102a37;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:7px;padding:5px 8px;font-size:12px}
  .mobile-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    background:var(--navy);z-index:35;padding:6px 8px;gap:6px;
    overflow-x:auto;scrollbar-width:none;border-top:1px solid rgba(255,255,255,.12)
  }
  .mobile-nav::-webkit-scrollbar{display:none}
  .mobile-nav button{
    flex:0 0 auto;background:transparent;border:0;color:#b7cdca;
    font-size:11px;padding:7px 11px;border-radius:8px;white-space:nowrap;
    display:flex;align-items:center;gap:5px
  }
  .mobile-nav button.active{background:#116b5c;color:#fff;font-weight:700}
  .content{padding:16px 14px 85px}
  .top{padding:10px 14px}
  .g3,.g2,.steps,.form-grid,.step-tabs{grid-template-columns:1fr}
}
@media(max-width:520px){
  .g4{grid-template-columns:1fr}
  .hero{padding:20px}
}
</style>
</head>

/* GENERADOR DE VENTAS CON AL MENOS 10 OBSERVACIONES POR PRODUCTO */
function generateRichSales(products) {
  const rows = [];
  let id = 1;
  const start = new Date('2026-08-18T12:00:00');
  const channels = ['Tienda', 'WhatsApp', 'Delivery', 'Instagram'];
  products.forEach((p, pIdx) => {
    const baseQty = Math.max(2, Math.round((p.baseSales || 90) / 28));
    for (let obs = 0; obs < 10; obs++) {
      const d = new Date(start);
      d.setDate(start.getDate() + obs * 6 + (pIdx % 3));
      const seasonalBoost = (obs >= 6) ? Math.ceil(baseQty * 0.25) : 0;
      const wave = (obs % 3 === 0) ? 2 : (obs % 2 === 0 ? 1 : 0);
      const qty = Math.max(1, baseQty + seasonalBoost + wave);
      const price = +(p.price - (obs % 4 === 0 ? +(p.price * 0.03).toFixed(1) : 0)).toFixed(2);
      rows.push({
        id: id++,
        date: d.toISOString().slice(0, 10),
        productId: p.id,
        qty,
        price,
        discount: obs % 5 === 0 ? +(price * 0.05).toFixed(2) : 0,
        channel: channels[(obs + pIdx) % channels.length],
        customer: '',
        notes: ''
      });
    }
  });
  return rows.sort((a, b) => a.date.localeCompare(b.date));
}

function totals() {
  const sales = db.sales.reduce((a, s) => a + s.qty * s.price - (s.discount || 0), 0);
  const cogs = db.sales.reduce((a, s) => a + s.qty * (product(s.productId)?.cost || 0), 0);
  const exp = db.expenses.reduce((a, e) => a + e.amount, 0);
  return { sales, cogs, exp, gross: sales - cogs, oper: sales - cogs - exp, margin: sales ? (sales - cogs) / sales : 0 };
}

function periodSales() {
  const dates = db.sales.map(s => s.date).sort();
  const latestStr = dates[dates.length - 1] || '2026-10-23';
  const now = new Date(latestStr + 'T12:00:00');
  const start = new Date(now);
  start.setDate(now.getDate() - (state.period === 'semana' ? 7 : state.period === 'trimestre' ? 90 : 35));
  return db.sales.filter(s => new Date(s.date + 'T12:00:00') >= start);
}

function svgSales() {
  const ps = periodSales(), days = {};
  ps.forEach(s => days[s.date] = (days[s.date] || 0) + s.qty * s.price - (s.discount || 0));
  const entries = Object.entries(days).sort((a, b) => a[0].localeCompare(b[0]));
  if (!entries.length) return `<div class="empty">Aún no hay ventas en este rango.</div>`;
  const vals = entries.map(e => e[1]);
  const max = Math.max(...vals, 1), w = 700, h = 210, p = 28;
  const pts = entries.map(([d, v], i) => `${p + i * Math.max(1, (w - 2 * p) / (entries.length - 1 || 1))},${h - p - (v / max) * (h - 2 * p)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}">
    <line x1="${p}" y1="${h - p}" x2="${w - p}" y2="${h - p}" stroke="#dbe5e2"/>
    <polyline points="${pts}" fill="none" stroke="#0b7a63" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${entries.map(([d, v], i) => {
      const x = p + i * Math.max(1, (w - 2 * p) / (entries.length - 1 || 1));
      const y = h - p - (v / max) * (h - 2 * p);
      return `<circle cx="${x}" cy="${y}" r="4.5" fill="#f2b233"><title>${d}: ${money(v)}</title></circle>`;
    }).join('')}
  </svg>`;
}

/* ==================== PANTALLA 7: PRONÓSTICOS IA AVANZADOS ==================== */
function computeForecastData(p, horizonDays, seasonMult) {
  const ss = db.sales.filter(s => s.productId == p.id).sort((a, b) => a.date.localeCompare(b.date));
  const ys = ss.map(s => s.qty);
  const n = ys.length || 1;
  const avgObs = ys.reduce((a, b) => a + b, 0) / n;

  // Regresión lineal simple sobre serie temporal de observaciones
  let slope = 0;
  if (n >= 2) {
    const xs = ys.map((_, i) => i + 1);
    const mx = xs.reduce((a, b) => a + b, 0) / n;
    let numS = 0, denS = 0;
    xs.forEach((x, i) => { numS += (x - mx) * (ys[i] - avgObs); denS += (x - mx) ** 2; });
    slope = denS ? numS / denS : 0;
  }

  // Desviación estándar para bandas de confianza (80% / 95%)
  const variance = ys.reduce((a, y) => a + (y - avgObs) ** 2, 0) / Math.max(1, n - 1);
  const stdDev = Math.sqrt(variance) || avgObs * 0.15;

  // Proyección en bloques de 5 días hasta cubrir el horizonte (14, 30 o 60 días)
  const stepsCount = Math.round(horizonDays / 5);
  const futureLabels = [];
  const expectedSeries = [];
  const upperSeries = [];
  const lowerSeries = [];

  for (let k = 1; k <= stepsCount; k++) {
    futureLabels.push(`+${k * 5}d`);
    const rawProj = Math.max(1, (avgObs + slope * (n + k)) * seasonMult);
    const expVal = Math.round(rawProj);
    const band = Math.max(1, Math.round(1.28 * stdDev * Math.sqrt(1 + k * 0.12)));
    expectedSeries.push(expVal);
    upperSeries.push(expVal + band);
    lowerSeries.push(Math.max(0, expVal - band));
  }

  const totalExpectedUnits = expectedSeries.reduce((a, b) => a + b, 0);
  const totalOptimisticUnits = upperSeries.reduce((a, b) => a + b, 0);
  const totalConservativeUnits = lowerSeries.reduce((a, b) => a + b, 0);
  const dailyDemand = totalExpectedUnits / horizonDays;
  const safetyStock = Math.ceil(1.65 * stdDev);
  const daysUntilStockout = dailyDemand > 0 ? Math.max(0, Math.floor(p.stock / dailyDemand)) : 99;
  const recommendedPurchase = Math.max(0, Math.ceil(totalExpectedUnits + safetyStock - p.stock));

  return {
    ss, ys, avgObs, slope, stdDev, futureLabels, expectedSeries, upperSeries, lowerSeries,
    totalExpectedUnits, totalOptimisticUnits, totalConservativeUnits,
    dailyDemand, safetyStock, daysUntilStockout, recommendedPurchase
  };
}

  const p = product(state.productId);
  const horizon = Number(state.forecastHorizon || 30);
  const seasonMult = Number(state.forecastSeason || 1.0);
  const fc = computeForecastData(p, horizon, seasonMult);
  const projectedRevenue = fc.totalExpectedUnits * p.price;
  const projectedProfit = fc.totalExpectedUnits * (p.price - p.cost);

  return `<div class="screen">

/* ==================== PANTALLA 8: SIMULADOR ¿QUÉ PASARÍA SI...? MEJORADO ==================== */
function computeScenarioMath(p, priceDelta, costDelta, compDelta, mktSpend) {
  const basePrice = p.price;
  const baseCost = p.cost;
  const baseUnits = p.baseSales || db.sales.filter(s => s.productId == p.id).reduce((a, s) => a + s.qty, 0) || 100;
  const elasticity = Number(p.elasticity || -1.2);

  const newPrice = +(basePrice * (1 + priceDelta / 100)).toFixed(2);
  const newCost = +(baseCost * (1 + costDelta / 100)).toFixed(2);

  // Efecto precio propio + elasticidad cruzada de competencia + impulso de marketing
  const priceEffect = (priceDelta / 100) * elasticity;
  const crossElasticity = Math.abs(elasticity) * 0.35;
  const compEffect = (compDelta / 100) * crossElasticity;
  const mktEffect = mktSpend > 0 ? Math.log10(mktSpend + 1) * 0.055 : 0;

  const simUnits = Math.max(0, Math.round(baseUnits * (1 + priceEffect + compEffect + mktEffect)));

  const baseRev = baseUnits * basePrice;
  const baseTotalCost = baseUnits * baseCost;
  const baseProfit = baseRev - baseTotalCost;

  const simRev = simUnits * newPrice;
  const simTotalCost = simUnits * newCost + mktSpend;
  const simProfit = simRev - simTotalCost;
  const profitDiff = simProfit - baseProfit;

  // Buscador de Precio Óptimo (barre de -30% a +30% con los costos/competencia actuales)
  let bestDelta = 0;
  let maxProfit = -Infinity;
  const curveLabels = [];
  const curveProfits = [];

  for (let d = -30; d <= 30; d += 5) {
    const testP = basePrice * (1 + d / 100);
    const testU = Math.max(0, Math.round(baseUnits * (1 + (d / 100) * elasticity + compEffect + mktEffect)));
    const testProf = testU * (testP - newCost) - mktSpend;
    curveLabels.push(`${d > 0 ? '+' : ''}${d}%`);
    curveProfits.push(Math.round(testProf));
    if (testProf > maxProfit) {
      maxProfit = testProf;
      bestDelta = d;
    }
  }
  const optimalPrice = +(basePrice * (1 + bestDelta / 100)).toFixed(2);

  return {
    basePrice, baseCost, baseUnits, elasticity,
    newPrice, newCost, simUnits,
    baseRev, baseTotalCost, baseProfit,
    simRev, simTotalCost, simProfit, profitDiff,
    bestDelta, optimalPrice, maxProfit, curveLabels, curveProfits
  };
}

function updateScenarioViewOnly() {
  const panel = $('#scenario-dynamic-panel');
  if (!panel) return;
  const p = product(state.productId);
  const res = computeScenarioMath(p, state.priceDelta, state.costDelta, state.compDelta, state.mktSpend);

  $('#lbl-price-delta').textContent = `${state.priceDelta > 0 ? '+' : ''}${state.priceDelta}% (${money(res.newPrice)})`;
  $('#lbl-cost-delta').textContent = `${state.costDelta > 0 ? '+' : ''}${state.costDelta}% (${money(res.newCost)})`;
  $('#lbl-comp-delta').textContent = `${state.compDelta > 0 ? '+' : ''}${state.compDelta}%`;
  $('#lbl-mkt-spend').textContent = `S/ ${state.mktSpend}`;

  // Alarmas inteligentes
  const alarms = [];
  if (res.newPrice <= res.newCost) {
    alarms.push(`<div class="insight red"><b>🚨 ALERTA CRÍTICA DE PÉRDIDA UNITARIA:</b> Tu precio simulado (${money(res.newPrice)}) es menor o igual al costo unitario (${money(res.newCost)}). Pierdes dinero en cada unidad vendida.</div>`);
  } else if (res.simProfit < 0) {
    alarms.push(`<div class="insight red"><b>🚨 PELIGRO DE PÉRDIDA NETA:</b> Los ingresos no alcanzan a cubrir el costo del producto más el gasto de marketing.</div>`);
  }
  if (res.simUnits > res.baseUnits && res.profitDiff < 0) {
    alarms.push(`<div class="insight warn"><b>⚠️ ALERTA DE CANIBALIZACIÓN (Ilusión de Volumen):</b> Vendes +${num(res.simUnits - res.baseUnits)} unidades más, pero tu ganancia neta cae en <b>${money(Math.abs(res.profitDiff))}</b> porque el descuento destruye tu margen.</div>`);
  }
  const unitDropPct = res.baseUnits ? ((res.simUnits - res.baseUnits) / res.baseUnits) * 100 : 0;
  if (unitDropPct <= -25) {
    alarms.push(`<div class="insight warn"><b>⚠️ RIESGO DE FUGA DE CLIENTES:</b> El alza de precio provoca una caída estimada del <b>${Math.abs(unitDropPct).toFixed(1)}%</b> en las unidades vendidas.</div>`);
  }
  if (res.profitDiff > 0) {
    alarms.push(`<div class="insight"><b>✅ ESTRATEGIA RENTABLE:</b> Este escenario genera <b>+${money(res.profitDiff)} adicionales</b> de ganancia libre al mes respecto a tu situación actual.</div>`);
  }
  if (!alarms.length) {
    alarms.push(`<div class="insight"><b>ℹ️ Escenario Neutro:</b> Modifica los deslizadores de la izquierda o haz clic en <b>"Aplicar Precio Óptimo IA"</b> para maximizar tu utilidad.</div>`);
  }

  panel.innerHTML = `
    <div class="grid g2">
      <div style="border:1px solid var(--line);padding:14px;border-radius:12px;background:#fff">
        <span class="eyebrow">Escenario Base Actual</span>
        <div style="margin-top:10px;display:grid;gap:7px;font-size:13px">
          <div style="display:flex;justify-content:space-between"><span>Precio / Costo unit.:</span><b>${money(res.basePrice)} / ${money(res.baseCost)}</b></div>
          <div style="display:flex;justify-content:space-between"><span>Demanda mensual:</span><b>${num(res.baseUnits)} unid.</b></div>
          <div style="display:flex;justify-content:space-between"><span>Facturación bruta:</span><b>${money(res.baseRev)}</b></div>
          <div style="display:flex;justify-content:space-between;font-size:15px;color:var(--navy);border-top:1px solid var(--line);padding-top:6px"><span>Ganancia Neta Base:</span><b>${money(res.baseProfit)}</b></div>
        </div>
      </div>

      <div style="border:2px solid ${res.profitDiff < 0 ? 'var(--red)' : 'var(--green)'};padding:14px;border-radius:12px;background:${res.profitDiff < 0 ? '#fff5f3' : '#f2fbf8'}">
        <span class="eyebrow">Resultado Simulado (${res.profitDiff >= 0 ? 'Ganancia ↑' : 'Ganancia ↓'})</span>
        <div style="margin-top:10px;display:grid;gap:7px;font-size:13px">
          <div style="display:flex;justify-content:space-between"><span>Nuevo Precio / Costo:</span><b>${money(res.newPrice)} / ${money(res.newCost)}</b></div>
          <div style="display:flex;justify-content:space-between"><span>Demanda proyectada:</span><b>${num(res.simUnits)} unid. (${unitDropPct >= 0 ? '+' : ''}${unitDropPct.toFixed(1)}%)</b></div>
          <div style="display:flex;justify-content:space-between"><span>Facturación simulada:</span><b>${money(res.simRev)}</b></div>
          <div style="display:flex;justify-content:space-between;font-size:15px;color:${res.profitDiff < 0 ? 'var(--red)' : 'var(--green)'};border-top:1px solid var(--line);padding-top:6px">
            <span>Ganancia Neta Sim.:</span><b>${money(res.simProfit)}</b>
          </div>
        </div>
      </div>
    </div>

    <div style="margin-top:12px;padding:11px 14px;background:#eef6ff;border-radius:10px;border:1px solid #bfdbfe;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:13px">
      <span>🎯 <b>Precio Óptimo Matemático detectado:</b> <b>${money(res.optimalPrice)}</b> (${res.bestDelta > 0 ? '+' : ''}${res.bestDelta}%) → Utilidad máxima de <b>${money(res.maxProfit)}</b></span>
      <button class="btn sm primary" data-action="apply-optimal">Aplicar ${res.bestDelta > 0 ? '+' : ''}${res.bestDelta}%</button>
    </div>

    <div style="margin-top:12px;display:grid;gap:8px">${alarms.join('')}</div>
  `;

  drawScenarioCharts(res);
}

function generateReportDataOnly() {
  const t = totals();
  const top = db.products.map(p => {
    const ss = db.sales.filter(s => s.productId == p.id);
    const u = ss.reduce((a, s) => a + s.qty, 0);
    const r = ss.reduce((a, s) => a + s.qty * s.price - (s.discount || 0), 0);
    const g = r - u * p.cost;
    const fc = computeForecastData(p, 30, 1.0);
    const opt = computeScenarioMath(p, 0, 0, 0, 0);
    return { p, u, r, g, fc, opt };
  }).sort((a, b) => b.g - a.g);

  const needRestock = top.filter(x => x.fc.recommendedPurchase > 0);
  const priceOpps = top.filter(x => x.opt.bestDelta !== 0);

  state.report = [
    `<b>1. Diagnóstico Financiero General (${esc(db.business.name)}):</b> Se procesaron <b>${db.sales.length} transacciones</b> con ventas netas de <b>${money(t.sales)}</b>, costo de mercadería de <b>${money(t.cogs)}</b> (Margen Bruto: <b>${pct(t.margin)}</b>) y gastos operativos de <b>${money(t.exp)}</b>, dejando una Utilidad Operativa Neta de <b>${money(t.oper)}</b>.`,
    top[0] ? `<b>2. Producto Líder en Contribución:</b> "${esc(top[0].p.name)}" genera <b>${money(top[0].g)}</b> de ganancia bruta con ${num(top[0].u)} unidades vendidas. Su demanda proyectada para los próximos 30 días es de <b>${num(top[0].fc.totalExpectedUnits)} unidades</b>.` : '',
    needRestock.length
      ? `<b>3. Acción Inmediata de Abastecimiento (Evitar Quiebre de Stock):</b> Reponer prioritariamente: ${needRestock.slice(0, 3).map(x => `<b>${esc(x.p.name)}</b> (pedir +${x.fc.recommendedPurchase} unid., cobertura actual de ${x.fc.daysUntilStockout} días)`).join('; ')}.`
      : `<b>3. Estado de Inventario:</b> Todas las referencias cuentan con stock suficiente para los próximos 30 días.`,
    priceOpps.length
      ? `<b>4. Optimización Econométrica de Precios (Elasticidad):</b> En <b>"${esc(priceOpps[0].p.name)}"</b> (Elasticidad ${priceOpps[0].p.elasticity}), ajustar el precio a <b>${money(priceOpps[0].opt.optimalPrice)} (${priceOpps[0].opt.bestDelta > 0 ? '+' : ''}${priceOpps[0].opt.bestDelta}%)</b> elevaría la ganancia mensual del producto a <b>${money(priceOpps[0].opt.maxProfit)}</b>.`
      : `<b>4. Fijación de Precios:</b> Tus precios actuales se encuentran en el punto de equilibrio óptimo.`,
    `<b>5. Control de Liquidez y Gastos:</b> El gasto fijo/operativo representa el <b>${pct(t.sales ? t.exp / t.sales : 0)}</b> de los ingresos totales. Evita promociones generalizadas mayores al 15% en productos inelásticos para no erosionar tu flujo de caja.`
  ].filter(Boolean);
}

/* ==================== GRÁFICOS (CHART.JS) ==================== */
function drawForecastChart() {
  const ctx = document.getElementById('forecastChart');
  if (!ctx) return;
  const p = product(state.productId);
  const horizon = Number(state.forecastHorizon || 30);
  const seasonMult = Number(state.forecastSeason || 1.0);
  const fc = computeForecastData(p, horizon, seasonMult);

  if (forecastChartInstance) forecastChartInstance.destroy();

  const histLabels = fc.ss.map(s => s.date.slice(5));
  const allLabels = [...histLabels, ...fc.futureLabels];
  const histData = [...fc.ys, ...fc.futureLabels.map(() => null)];
  const expData = [...fc.ys.map((_, i) => i === fc.ys.length - 1 ? fc.ys[i] : null), ...fc.expectedSeries];
  const upData = [...fc.ys.map((_, i) => i === fc.ys.length - 1 ? fc.ys[i] : null), ...fc.upperSeries];
  const lowData = [...fc.ys.map((_, i) => i === fc.ys.length - 1 ? fc.ys[i] : null), ...fc.lowerSeries];

  forecastChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: allLabels,
      datasets: [
        { label: 'Ventas Históricas (Unid.)', data: histData, borderColor: '#0b2530', backgroundColor: '#0b2530', borderWidth: 2.5, tension: 0.25, pointRadius: 3 },
        { label: 'Pronóstico Esperado IA', data: expData, borderColor: '#0b7a63', backgroundColor: '#0b7a63', borderDash: [6, 4], borderWidth: 3, tension: 0.25, pointRadius: 4 },
        { label: 'Banda Optimista (+)', data: upData, borderColor: 'rgba(20,163,127,0.35)', backgroundColor: 'rgba(20,163,127,0.12)', fill: '+1', borderWidth: 1, pointRadius: 0, tension: 0.25 },
        { label: 'Banda Conservadora (-)', data: lowData, borderColor: 'rgba(242,178,51,0.5)', backgroundColor: 'transparent', borderWidth: 1, pointRadius: 0, tension: 0.25 }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: 'top' } },
      scales: { y: { beginAtZero: true } }
    }
  });
}

function drawScenarioCharts(res) {
  const ctxBar = document.getElementById('scenarioBarChart');
  const ctxCurve = document.getElementById('scenarioCurveChart');
  if (ctxBar) {
    if (scenarioBarChartInstance) scenarioBarChartInstance.destroy();
    scenarioBarChartInstance = new Chart(ctxBar, {
      type: 'bar',

        labels: ['Ingresos Brutos', 'Costos + Marketing', 'Ganancia Neta Libre'],

          { label: 'Escenario Simulado', data: [res.simRev, res.simTotalCost, res.simProfit], backgroundColor: ['#0b2530', '#c74735', res.simProfit >= res.baseProfit ? '#14a37f' : '#f2b233'], borderRadius: 6 }

  const p2 = db.products[1] || { name: 'Producto Ejemplo B', price: 80, cost: 48 };

    `2026-10-26,"${p2.name}",3,${p2.price},${p2.cost},5,WhatsApp`,

  ].join('\n');
}

function parseCSVLine(line, delimiter) {
  const result = [];
  let cur = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQuotes = !inQuotes; continue; }
    if (ch === delimiter && !inQuotes) { result.push(cur.trim()); cur = ''; }
    else { cur += ch; }
  }
  result.push(cur.trim());
  return result;
}

function importCSVText(rawText) {
  const clean = rawText.replace(/^\uFEFF/, '').trim();
  const lines = clean.split(/\r?\n/).filter(l => l.trim().length > 0);
  if (lines.length < 2) { toast('El archivo CSV está vacío'); return; }

  const delimiter = lines[0].includes(';') && !lines[0].includes(',') ? ';' : ',';
  const headers = parseCSVLine(lines[0], delimiter).map(h => h.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""));

  let imported = 0, createdProducts = 0;
  for (const line of lines.slice(1)) {
    const cols = parseCSVLine(line, delimiter);
    if (cols.length < 3) continue;
    const row = {};
    headers.forEach((h, i) => row[h] = cols[i] ?? '');

    const prodName = (row.producto || row.nombre_producto || row.nombre || row.item || cols[1] || '').trim();
    const dateRaw = (row.fecha || row.date || cols[0] || '2026-10-25').trim();
    const qty = Math.max(1, parseFloat(row.cantidad || row.cantidad_vendida || row.unidades || cols[2] || '1') || 1);
    const price = Math.max(0, parseFloat(row.precio || row.precio_unitario_venta || row.precio_venta || cols[3] || '0') || 0);
    const costInCsv = parseFloat(row.costo_unitario || row.costo || row.costo_unitario_insumo || '0');
    const discount = Math.max(0, parseFloat(row.descuento || '0') || 0);
    const channelName = (row.canal || 'Tienda').trim();

    if (!prodName || price <= 0) continue;

    // Busca el producto o lo crea automáticamente si no existe
    let p = db.products.find(x => x.name.toLowerCase() === prodName.toLowerCase());
    if (!p) {
      const newId = db.products.reduce((m, x) => Math.max(m, x.id), 0) + 1;
      const estCost = costInCsv > 0 ? costInCsv : +(price * 0.62).toFixed(2);
      p = {
        id: newId,
        name: prodName,
        sku: `CSV-00${newId}`,
        cat: row.categoria || 'General',
        price: price,
        cost: estCost,
        stock: 35,
        minStock: 10,
        status: 'Activo',
        elasticity: -1.2,
        baseSales: qty * 18,
        leadTime: 4,
        seasonTag: 'Importado CSV'
      };
      db.products.push(p);
      createdProducts++;
    }

    db.sales.push({
      id: Date.now() + imported,
      date: /^\d{4}-\d{2}-\d{2}$/.test(dateRaw) ? dateRaw : '2026-10-25',
      productId: p.id,
      qty,
      price,
      discount,
      channel: channelName,
      customer: '',
      notes: 'Importado vía CSV'
    });
    p.stock = Math.max(0, (p.stock || 0) - qty);
    imported++;
  }

  save();
  $('#modal-root').innerHTML = '';
  shell();
  toast(`✅ ${imported} ventas importadas (${createdProducts} productos nuevos creados)`);
}

function afterRender() {
  $('#period')?.addEventListener('change', e => { state.period = e.target.value; render(); });
  $('#sales-search')?.addEventListener('input', e => { state.search = e.target.value; render(); });
  $('#sale-prod-select')?.addEventListener('change', e => {
    const p = product(+e.target.value);
    const inp = $('#sale-price-input');
    if (p && inp) inp.value = p.price;
  });

  $('#sale-form')?.addEventListener('submit', e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const pid = +f.get('productId'), qty = +f.get('qty');
    db.sales.push({ id: Date.now(), date: f.get('date'), productId: pid, qty, price: +f.get('price'), discount: +f.get('discount'), channel: f.get('channel'), customer: '', notes: '' });
    const p = product(pid);
    if (p) p.stock = Math.max(0, p.stock - qty);
    save(); toast('✅ Venta registrada e inventario actualizado'); render();
  });

  $('#expense-form')?.addEventListener('submit', e => {
    e.preventDefault();
    const f = new FormData(e.target);
    db.expenses.push({ id: Date.now(), date: f.get('date'), desc: f.get('desc'), amount: +f.get('amount'), cat: f.get('cat'), type: f.get('type'), freq: f.get('freq') });
    save(); toast('✅ Gasto registrado'); render();
  });

  $('#config-form')?.addEventListener('submit', e => {
    e.preventDefault();
    const f = new FormData(e.target);
    db.business = { name: f.get('name'), sector: f.get('sector'), owner: f.get('owner'), whatsapp: f.get('whatsapp'), email: f.get('email') };
    save(); toast('✅ Configuración guardada'); shell();
  });

  // Eventos de Pronósticos
  $('#forecast-product')?.addEventListener('change', e => { state.productId = +e.target.value; render(); });
  $('#forecast-horizon')?.addEventListener('change', e => { state.forecastHorizon = +e.target.value; render(); });
  $('#forecast-season')?.addEventListener('change', e => { state.forecastSeason = +e.target.value; render(); });
  if (state.screen === 'pronosticos') drawForecastChart();

  // Eventos del Simulador (sin re-renderizar los sliders para no perder foco al arrastrar)
  $('#scenario-product')?.addEventListener('change', e => {
    state.productId = +e.target.value;
    state.priceDelta = 0; state.costDelta = 0; state.compDelta = 0; state.mktSpend = 0;
    render();
  });
  $('#price-range')?.addEventListener('input', e => { state.priceDelta = +e.target.value; updateScenarioViewOnly(); });
  $('#cost-range')?.addEventListener('input', e => { state.costDelta = +e.target.value; updateScenarioViewOnly(); });
  $('#comp-range')?.addEventListener('input', e => { state.compDelta = +e.target.value; updateScenarioViewOnly(); });
  $('#mkt-range')?.addEventListener('input', e => { state.mktSpend = +e.target.value; updateScenarioViewOnly(); });
  if (state.screen === 'escenarios') updateScenarioViewOnly();
}

function startVideoTour() {
  stopVideoTour();
  state.videoPlaying = true;
  videoTimer = setInterval(() => {
    state.videoStep = (state.videoStep + 1) % 4;
    const container = $('#interactive-tour');
    if (container) container.outerHTML = interactiveVideoHTML();
    else stopVideoTour();
  }, 3200);
}
function stopVideoTour() {
  state.videoPlaying = false;
  if (videoTimer) { clearInterval(videoTimer); videoTimer = null; }
}

document.addEventListener('click', e => {
  const n = e.target.closest('[data-nav]');
  if (n) { state.screen = n.dataset.nav; state.search = ''; shell(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }

  const simBtn = e.target.closest('[data-sim-prod]');
  if (simBtn) { state.productId = +simBtn.dataset.simProd; state.screen = 'escenarios'; shell(); return; }

  const vStep = e.target.closest('[data-video-step]');
  if (vStep) {
    stopVideoTour();
    state.videoStep = +vStep.dataset.videoStep;
    const c = $('#interactive-tour');
    if (c) c.outerHTML = interactiveVideoHTML();
    return;
  }

  if (e.target.closest('[data-action="toggle-video"]')) {
    if (state.videoPlaying) stopVideoTour(); else startVideoTour();
    const c = $('#interactive-tour');
    if (c) c.outerHTML = interactiveVideoHTML();
    return;
  }

  if (e.target.closest('[data-action="apply-optimal"]')) {
    const p = product(state.productId);
    const res = computeScenarioMath(p, state.priceDelta, state.costDelta, state.compDelta, state.mktSpend);
    state.priceDelta = res.bestDelta;
    const slider = $('#price-range');
    if (slider) slider.value = res.bestDelta;
    updateScenarioViewOnly();
    toast(`🎯 Precio óptimo aplicado (${res.bestDelta > 0 ? '+' : ''}${res.bestDelta}%)`);
    return;
  }

  if (e.target.closest('[data-action="reset-scenario"]')) {
    state.priceDelta = 0; state.costDelta = 0; state.compDelta = 0; state.mktSpend = 0;
    render();
    return;
  }

  const del = e.target.closest('[data-delete-sale]');
  if (del) { db.sales = db.sales.filter(x => x.id != del.dataset.deleteSale); save(); render(); toast('Venta eliminada'); return; }

  const de = e.target.closest('[data-delete-expense]');
  if (de) { db.expenses = db.expenses.filter(x => x.id != de.dataset.deleteExpense); save(); render(); toast('Gasto eliminado'); return; }

  const edit = e.target.closest('[data-edit-product]');
  if (edit) { openModal('Editar parámetros del producto', productForm(product(edit.dataset.editProduct))); return; }

  if (e.target.closest('[data-action="new-product"]')) { openModal('Nuevo producto', productForm()); return; }

  if (e.target.closest('[data-action="import"]')) {
    openModal('Importar archivo CSV de Ventas', `
      <p class="muted" style="margin-top:0">Sube tu archivo CSV (separado por comas <code>,</code> o punto y coma <code>;</code>). Si el archivo incluye productos nuevos, EconoMétrica los agregará automáticamente a tu catálogo.</p>
      <div style="border:2px dashed var(--green);background:#f3f8f6;padding:18px;border-radius:12px;text-align:center;margin:12px 0">
        <input id="csv-file" type="file" accept=".csv,.txt" style="max-width:100%">
      </div>
      <div style="display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:14px">
        <button class="btn" data-action="download-template">⬇️ Descargar Plantilla CSV de ejemplo</button>
        <div style="display:flex;gap:8px">
          <button class="btn gold" data-action="instant-csv-demo">⚡ Simular subida de plantilla ahora</button>
          <button class="btn primary" data-action="process-csv">Validar e importar archivo</button>
        </div>
      </div>
    `);
    return;
  }

  if (e.target.closest('[data-action="process-csv"]')) {
    const fileInput = $('#csv-file');
    if (!fileInput || !fileInput.files || !fileInput.files[0]) {
      toast('⚠️ Primero selecciona un archivo .CSV de tu dispositivo');
      return;
    }
    const reader = new FileReader();
    reader.onload = () => importCSVText(reader.result);
    reader.readAsText(fileInput.files[0]);
    return;
  }

  if (e.target.closest('[data-action="instant-csv-demo"]')) {
    importCSVText(generateTemplateCSVContent());
    return;
  }

  if (e.target.closest('[data-action="whatsapp-preview"]')) { openWhatsAppModal(); return; }
  if (e.target.closest('[data-action="report"]')) { generateReportDataOnly(); state.screen = 'reportes'; shell(); return; }
  if (e.target.closest('[data-action="generate-report"]')) { generateReportDataOnly(); render(); toast('Reporte actualizado'); return; }
  if (e.target.closest('[data-action="print-report"]')) { window.print(); return; }

  if (e.target.closest('[data-action="export-sales"]')) {
    downloadCSV(db.sales.map(s => ({ Fecha: s.date, Producto: product(s.productId)?.name || '', Cantidad: s.qty, Precio: s.price, Costo_Unitario: product(s.productId)?.cost || 0, Descuento: s.discount || 0, Canal: s.channel })), `ventas_${db.demoKey}.csv`);
    return;
  }
  if (e.target.closest('[data-action="export-expenses"]')) {
    downloadCSV(db.expenses.map(x => ({ Fecha: x.date, Descripcion: x.desc, Importe: x.amount, Categoria: x.cat, Tipo: x.type, Frecuencia: x.freq })), `gastos_${db.demoKey}.csv`);
    return;
  }
  if (e.target.closest('[data-action="export-json"]')) {
    downloadText(JSON.stringify(db, null, 2), 'econometrica-backup.json', 'application/json');
    return;
  }
  if (e.target.closest('[data-action="download-template"]')) {
    downloadText('\uFEFF' + generateTemplateCSVContent(), `Plantilla_EconoMetrica_${db.demoKey}.csv`, 'text/csv;charset=utf-8');
    toast('⬇️ Plantilla CSV lista para usar descargada');
    return;
  }
  if (e.target.closest('[data-action="reset"]')) {
    localStorage.removeItem(KEY);
    location.reload();
    return;
  }
  if (e.target.closest('[data-action="landing"]')) { stopVideoTour(); landing(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  if (e.target.closest('[data-action="enter"]')) { stopVideoTour(); state.screen = 'inicio'; shell(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }

  if (e.target.closest('[data-action="modal-register"]')) {
    openModal('Configurar cuenta PYME', `<form id="register-form" class="form-grid">
      <div class="field"><label>Nombre del negocio</label><input name="name" placeholder="Ej. Bodega San Martín" required></div>
      <div class="field"><label>Sector</label><select name="sector"><option>Comercio minorista / Bodega</option><option>Restaurantes y gastronomía</option><option>Ropa y calzado</option><option>Ferretería y construcción</option><option>Farmacia y salud</option></select></div>
      <div class="field"><label>Responsable</label><input name="owner" required></div>
      <div class="field"><label>WhatsApp de alertas</label><input name="whatsapp" value="+51 999 888 777" required></div>
      <div class="field full"><button class="btn primary">Crear espacio de trabajo</button></div>
    </form>`);
    return;
  }

  if (e.target.closest('[data-action="close"]')) { $('#modal-root').innerHTML = ''; return; }
  const plan = e.target.closest('[data-plan]');
  if (plan) { toast('✨ Plan seleccionado en demo: ' + plan.dataset.plan); return; }
});

document.addEventListener('submit', e => {
  if (e.target.id === 'register-form') {
    e.preventDefault();
    const f = new FormData(e.target);
    db.business = { name: f.get('name'), sector: f.get('sector'), owner: f.get('owner'), whatsapp: f.get('whatsapp'), email: 'contacto@pyme.pe' };
    save(); $('#modal-root').innerHTML = ''; state.screen = 'inicio'; shell(); toast('🎉 Espacio creado para ' + db.business.name);
  }
  if (e.target.id === 'product-form') {
    e.preventDefault();
    const f = new FormData(e.target);
    const id = +f.get('id') || (db.products.reduce((m, x) => Math.max(m, x.id), 0) + 1);
    const existing = db.products.find(x => x.id === id);
    const p = {
      id,
      name: f.get('name'),
      sku: f.get('sku'),
      cat: f.get('cat'),
      price: +f.get('price'),
      cost: +f.get('cost'),
      stock: +f.get('stock'),
      minStock: existing?.minStock || 10,
      status: 'Activo',
      elasticity: +f.get('elasticity') || -1.2,
      baseSales: existing?.baseSales || 90,
      leadTime: existing?.leadTime || 4,
      seasonTag: f.get('seasonTag') || 'Constante'
    };
    const i = db.products.findIndex(x => x.id === id);
    if (i >= 0) db.products[i] = p; else db.products.push(p);
    save(); $('#modal-root').innerHTML = ''; render(); toast('✅ Producto guardado');
  }
});

function downloadCSV(rows, name) {
  const h = Object.keys(rows[0] || {});
  const csv = '\uFEFF' + [h.join(','), ...rows.map(r => h.map(k => `"${String(r[k] ?? '').replaceAll('"', '""')}"`).join(','))].join('\n');
  downloadText(csv, name, 'text/csv;charset=utf-8');
}
function downloadText(txt, name, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function toast(t) {
  const x = $('#toast');
  if (!x) return;
  x.textContent = t;
  x.classList.add('show');
  setTimeout(() => x.classList.remove('show'), 2600);
}

function switchDemoBusiness(key) {
  if (!DEMO_BUSINESSES[key]) return;
  db = buildDemoState(key);
  save();
  state.productId = db.products[0]?.id || 1;
  state.priceDelta = 0; state.costDelta = 0; state.compDelta = 0; state.mktSpend = 0;
  state.report = null;
  if ($('.sidebar')) shell(); else landing();
  toast('🔄 Negocio cargado: ' + DEMO_BUSINESSES[key].business.name);
}

landing();
</script>
</body>
</html>
