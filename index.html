function demoSales(productIds, baseDate='2026-10-01') {
  const rows=[];
  const start=new Date(baseDate+'T12:00:00');
  let id=1;
  for(let i=0;i<26;i++){
    const d=new Date(start); d.setDate(start.getDate()+(i*2));
    const pid=productIds[i%productIds.length];
    const qty=2+(i%4);
    rows.push({
      id:id++,
      date:d.toISOString().slice(0,10),
      productId:pid,
      qty,
      price:null,
      discount:0,
      channel:['Tienda','WhatsApp','Delivery'][i%3]
    });
  }
  return rows;
}

function buildDemoState(key){
  const d=DEMO_BUSINESSES[key];
  const sales=demoSales(d.products.map(p=>p.id));
  sales.forEach(s=>{
    const p=d.products.find(p=>p.id===s.productId);
    s.price=p.price - (s.id%3===0?2:0); // variabilidad
  });
  return {
    business:{...d.business},
    products:d.products.map(x=>({...x})),
    expenses:d.expenses.map(x=>({...x})),
    sales,
    settings:{currency:'PEN',region:'Perú',demo:true},
    demoKey: key
  };
}

];

 const sales=db.sales.reduce((a,s)=>a+s.qty*s.price-(s.discount||0),0);
 const cogs=db.sales.reduce((a,s)=>a+s.qty*(product(s.productId)?.cost||0),0);
 const exp=db.expenses.reduce((a,e)=>a+e.amount,0);
 return {sales,cogs,exp,gross:sales-cogs,oper:sales-cogs-exp,margin:sales?(sales-cogs)/sales:0};
}
function periodSales(){
 const now=new Date('2026-10-23T12:00:00'); const start=new Date(now); start.setDate(now.getDate()-(state.period==='semana'?7:state.period==='trimestre'?90:30));
 return db.sales.filter(s=>new Date(s.date)>=start);
}

function kpi(a,b,c,good){return `<div class="card kpi"><span class="eyebrow">${a}</span><div class="value">${b}</div><div class="${good?'up':'down'} delta">${c}</div></div>`}
function quick(t,n){return `<button class="btn" data-nav="${n}" style="padding:16px;text-align:left">${t}<br><span class="muted">Abrir módulo →</span></button>`}
function svgSales(){const ps=periodSales(), days={};ps.forEach(s=>days[s.date]=(days[s.date]||0)+s.qty*s.price);const vals=Object.values(days);if(!vals.length)return `<div class="empty">Aún no hay ventas en este periodo.</div>`;const max=Math.max(...vals,1),w=700,h=210,p=25;const pts=Object.entries(days).map(([d,v],i)=>`${p+i*Math.max(1,(w-2*p)/(Object.keys(days).length-1||1))},${h-p-(v/max)*(h-2*p)}`).join(' ');return `<svg class="chart" viewBox="0 0 ${w} ${h}"><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="#dbe5e2"/><polyline points="${pts}" fill="none" stroke="#0b7a63" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${Object.entries(days).map(([d,v],i)=>{const x=p+i*Math.max(1,(w-2*p)/(Object.keys(days).length-1||1));const y=h-p-(v/max)*(h-2*p);return `<circle cx="${x}" cy="${y}" r="4" fill="#f2b233"><title>${d}: ${money(v)}</title></circle>`}).join('')}</svg>`}
function insights(top,t){let a=[];if(top[0])a.push(`"${esc(top[0].p.name)}" aporta aproximadamente ${money(top[0].con)} de contribución en el periodo visible.`);if(t.margin<.3)a.push(`El margen bruto calculado es ${pct(t.margin)}. Conviene revisar precios, costos unitarios y mezcla de productos.`);const big=db.expenses.slice().sort((a,b)=>b.amount-a.amount)[0];if(big)a.push(`El mayor egreso registrado es "${esc(big.desc)}" por ${money(big.amount)}. Un gasto elevado no se considera innecesario automáticamente.`);if(!db.sales.length)a.push('No hay ventas suficientes para generar hallazgos.');return a.map(x=>`<div class="insight" style="margin-bottom:8px">${x}</div>`).join('')}

 return `<div class="grid wide"><div class="card"><div class="card-head"><div><h3>Registrar venta</h3><span class="muted">El importe se calcula automáticamente.</span></div></div>${saleForm()}</div><div class="card"><div class="card-head"><div><h3>Resumen</h3><span class="muted">${rows.length} operaciones visibles</span></div><button class="btn sm" data-action="export-sales">Exportar CSV</button></div><div class="grid g3"><div><span class="eyebrow">Ingresos</span><h2>${money(rows.reduce((a,s)=>a+s.qty*s.price-(s.discount||0),0))}</h2></div><div><span class="eyebrow">Unidades</span><h2>${num(rows.reduce((a,s)=>a+s.qty,0))}</h2></div><div><span class="eyebrow">Canal principal</span><h2>${channel(rows)}</h2></div></div></div></div>
 <div class="card"><div class="card-head"><div><h3>Operaciones</h3><span class="muted">Busca, revisa y elimina registros.</span></div><input id="sales-search" placeholder="Buscar producto o fecha" value="${esc(state.search)}"></div>${salesTable(rows)}</div>`

function saleForm(){return `<form id="sale-form" class="form-grid"><div class="field"><label>Fecha</label><input name="date" type="date" value="2026-10-23" required></div><div class="field"><label>Producto</label><select name="productId">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Cantidad</label><input name="qty" type="number" min="1" value="1" required></div><div class="field"><label>Precio unitario (S/)</label><input name="price" type="number" step=".01" min="0" value="${db.products[0]?.price||0}" required></div><div class="field"><label>Descuento (S/)</label><input name="discount" type="number" step=".01" min="0" value="0"></div><div class="field"><label>Canal</label><select name="channel"><option>Tienda</option><option>WhatsApp</option><option>Instagram</option><option>Marketplace</option><option>Otro</option></select></div><div class="field"><label>Cliente (opcional)</label><input name="customer"></div><div class="field"><label>Observaciones</label><input name="notes"></div><div class="field full"><button class="btn primary">Guardar venta</button></div></form>`}
function salesTable(rows){if(!rows.length)return `<div class="empty">No hay registros que coincidan.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Producto</th><th>Canal</th><th class="num">Cantidad</th><th class="num">Precio</th><th class="num">Importe</th><th></th></tr></thead><tbody>${rows.slice().reverse().map(s=>`<tr><td>${s.date}</td><td>${esc(product(s.productId)?.name||'—')}</td><td>${esc(s.channel)}</td><td class="num">${s.qty}</td><td class="num">${money(s.price)}</td><td class="num">${money(s.qty*s.price-(s.discount||0))}</td><td><button class="btn sm danger" data-delete-sale="${s.id}">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`}
function channel(rows){const c={};rows.forEach(s=>c[s.channel]=(c[s.channel]||0)+1);return Object.entries(c).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—'}
function products(){return `<div class="card"><div class="card-head"><div><h3>Catálogo de productos</h3><span class="muted">Precios, costos, stock y categorías.</span></div><button class="btn primary" data-action="new-product">Nuevo producto</button></div><div class="table-wrap"><table><thead><tr><th>Producto</th><th>SKU</th><th>Categoría</th><th class="num">Precio</th><th class="num">Costo</th><th class="num">Stock</th><th>Estado</th><th></th></tr></thead><tbody>${db.products.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.sku)}</td><td>${esc(p.cat)}</td><td class="num">${money(p.price)}</td><td class="num">${money(p.cost)}</td><td class="num">${num(p.stock)}</td><td><span class="pill">${esc(p.status)}</span></td><td><button class="btn sm" data-edit-product="${p.id}">Editar</button></td></tr>`).join('')}</tbody></table></div></div>`}
function expenses(){return `<div class="grid wide"><div class="card"><div class="card-head"><div><h3>Registrar costo o gasto</h3><span class="muted">La clasificación es editable según el negocio.</span></div></div><form id="expense-form" class="form-grid"><div class="field"><label>Fecha</label><input name="date" type="date" value="2026-10-23" required></div><div class="field"><label>Descripción</label><input name="desc" required></div><div class="field"><label>Importe (S/)</label><input name="amount" type="number" step=".01" min="0" required></div><div class="field"><label>Categoría</label><select name="cat"><option>Alquiler</option><option>Sueldos</option><option>Servicios</option><option>Transporte</option><option>Marketing</option><option>Comisiones</option><option>Mercadería</option><option>Materias primas</option><option>Mantenimiento</option><option>Impuestos</option><option>Otros</option></select></div><div class="field"><label>Tipo</label><select name="type"><option>Fijo</option><option>Variable</option><option>Directo</option><option>Operativo</option><option>Otro</option></select></div><div class="field"><label>Frecuencia</label><select name="freq"><option>Único</option><option>Mensual</option><option>Recurrente</option></select></div><div class="field full"><button class="btn primary">Guardar gasto</button></div></form></div><div class="card"><div class="card-head"><div><h3>Concentración de egresos</h3><span class="muted">No se interpreta automáticamente como gasto innecesario.</span></div></div>${expenseBars()}</div></div><div class="card"><div class="card-head"><div><h3>Registros</h3></div><button class="btn sm" data-action="export-expenses">Exportar CSV</button></div><div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Descripción</th><th>Categoría</th><th>Tipo</th><th class="num">Importe</th><th></th></tr></thead><tbody>${db.expenses.slice().reverse().map(e=>`<tr><td>${e.date}</td><td>${esc(e.desc)}</td><td>${esc(e.cat)}</td><td>${esc(e.type)}</td><td class="num">${money(e.amount)}</td><td><button class="btn sm danger" data-delete-expense="${e.id}">Eliminar</button></td></tr>`).join('')}</tbody></table></div></div>`}
function expenseBars(){const c={};db.expenses.forEach(e=>c[e.cat]=(c[e.cat]||0)+e.amount);const arr=Object.entries(c).sort((a,b)=>b[1]-a[1]);const mx=arr[0]?.[1]||1;return `<div class="bar-list">${arr.map(([k,v])=>`<div class="bar-row"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${v/mx*100}%"></div></div><b>${money(v)}</b></div>`).join('')}</div>`}
function inventory(){const low=db.products.filter(p=>p.stock<=12);return `<div class="grid g3">${kpi('Unidades en stock',num(db.products.reduce((a,p)=>a+p.stock,0)),'Inventario actual',true)}${kpi('Productos con stock bajo',num(low.length),'Umbral demostrativo ≤ 12',low.length===0)}${kpi('Sin movimiento','0','Se requiere historial suficiente',true)}</div><div class="card"><div class="card-head"><div><h3>Inventario</h3><span class="muted">Vinculado a productos y ventas del prototipo.</span></div></div><div class="table-wrap"><table><thead><tr><th>Producto</th><th>Categoría</th><th class="num">Stock</th><th class="num">Ventas unidades</th><th>Estado</th></tr></thead><tbody>${db.products.map(p=>{const u=db.sales.filter(s=>s.productId==p.id).reduce((a,s)=>a+s.qty,0);return `<tr><td>${esc(p.name)}</td><td>${esc(p.cat)}</td><td class="num">${p.stock}</td><td class="num">${u}</td><td>${p.stock<=12?'<span class="pill" style="background:#fff3d8;color:#8a6100">Revisar</span>':'<span class="pill">Normal</span>'}</td></tr>`}).join('')}</tbody></table></div><div class="insight warn" style="margin-top:12px">Las alertas de reposición son orientativas: no se recomienda comprar solo con ventas históricas si no se conocen inventario real, tiempos de reposición y cambios en la demanda.</div></div>`}
function profit(){const rows=db.products.map(p=>{const ss=db.sales.filter(s=>s.productId==p.id),units=ss.reduce((a,s)=>a+s.qty,0),rev=ss.reduce((a,s)=>a+s.qty*s.price-(s.discount||0),0),cost=units*p.cost,gross=rev-cost;return{p,units,rev,cost,gross,margin:rev?gross/rev:0,share:0}});const total=rows.reduce((a,x)=>a+x.rev,0);rows.forEach(x=>x.share=total?x.rev/total:0);return `<div class="card"><div class="card-head"><div><h3>Rentabilidad de mi negocio</h3><span class="muted">Los cálculos usan ventas y costos unitarios registrados.</span></div><button class="btn" data-nav="escenarios">Simular precio</button></div><div class="table-wrap"><table><thead><tr><th>Producto</th><th class="num">Unidades</th><th class="num">Ingresos</th><th class="num">Costos directos</th><th class="num">Margen bruto</th><th class="num">Margen %</th><th class="num">Participación</th></tr></thead><tbody>${rows.sort((a,b)=>b.gross-a.gross).map(x=>`<tr><td><b>${esc(x.p.name)}</b></td><td class="num">${num(x.units)}</td><td class="num">${money(x.rev)}</td><td class="num">${money(x.cost)}</td><td class="num">${money(x.gross)}</td><td class="num">${pct(x.margin)}</td><td class="num">${pct(x.share)}</td></tr>`).join('')}</tbody></table></div><div class="grid g2" style="margin-top:14px"><div class="insight"><b>Lectura:</b> la utilidad bruta es ingresos netos menos costo de productos vendidos. No equivale a utilidad neta porque aún pueden existir gastos operativos, impuestos y otros conceptos.</div><div class="insight warn"><b>Atención:</b> un producto puede tener ventas elevadas y una contribución reducida; revisa precio, costo y volumen conjuntamente.</div></div></div>`}
function forecast(){const p=product(state.productId)||db.products[0];const ss=db.sales.filter(s=>s.productId==p.id).sort((a,b)=>a.date.localeCompare(b.date));const enough=ss.length>=8;const units=ss.reduce((a,s)=>a+s.qty,0);const avgU=ss.length?units/ss.length:0;let slope=0; if(enough){const ys=ss.map(s=>s.qty),xs=ys.map((_,i)=>i+1),mx=xs.reduce((a,b)=>a+b,0)/xs.length,my=avgU;let d=0,n=0;xs.forEach((x,i)=>{d+=(x-mx)**2;n+=(x-mx)*(ys[i]-my)});slope=d?n/d:0}const forecast=Math.max(0,avgU+slope*4);return `<div class="card"><div class="card-head"><div><h3>Pronóstico de demanda</h3><span class="muted">Método demostrativo de referencia; no es garantía de ventas.</span></div><select id="forecast-product">${db.products.map(x=>`<option value="${x.id}" ${x.id==p.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>${enough?`<div class="grid g3">${kpi('Observaciones',num(ss.length),'Ventas registradas',true)}${kpi('Promedio por operación',num(avgU),'Unidades',true)}${kpi('Referencia próxima',num(forecast),'Escenario de 4 operaciones',true)}</div><div class="insight warn">La referencia se obtiene de una tendencia lineal simple sobre las unidades por operación. Para un modelo econométrico fiable se necesita una estructura temporal adecuada, suficiente historial y variables explicativas; este prototipo no afirma causalidad ni precisión estadística.</div>`:`<div class="empty"><h3>Información insuficiente</h3><p>Se requieren al menos 8 observaciones del producto seleccionado para mostrar una referencia descriptiva. Con menos datos, el sistema evita inventar pronósticos.</p><button class="btn primary" data-nav="ventas">Registrar más ventas</button></div>`}</div>`}

function scenarios(){
 const p=product(state.productId)||db.products[0];
 const d=Number(state.priceDelta||0);
 
 // Lógica mejorada del simulador
 const currentPrice = p.price;
 const currentCost = p.cost;
 const baseUnits = p.baseSales || db.sales.filter(s=>s.productId==p.id).reduce((a,s)=>a+s.qty,0) || 100;
 const elasticity = p.elasticity || -1.0;
 
 const newPrice = currentPrice * (1 + d/100);
 const demandChange = (d/100) * elasticity;
 let simUnits = Math.round(baseUnits * (1 + demandChange));
 if(simUnits < 0) simUnits = 0;
 
 const baseRev = baseUnits * currentPrice;
 const baseTotalCost = baseUnits * currentCost;
 const baseProfit = baseRev - baseTotalCost;
 
 const simRev = simUnits * newPrice;
 const simTotalCost = simUnits * currentCost;
 const simProfit = simRev - simTotalCost;
 
 const profitDiff = simProfit - baseProfit;
 const marginPct = simRev > 0 ? (simProfit/simRev)*100 : 0;
 
 let alertHtml = '';
 if (simProfit < 0) {
    alertHtml = `<div class="insight red"><b>🚨 Peligro de Pérdidas:</b> Estás vendiendo por debajo de tu costo total. Modifica el precio urgentemente.</div>`;
 } else if (profitDiff < 0) {
    alertHtml = `<div class="insight warn"><b>⚠️ Alerta de Canibalización:</b> Vendes mercadería, pero estás perdiendo ${money(Math.abs(profitDiff))} en ganancias respecto al escenario base.</div>`;
 } else if (profitDiff > 0) {
    alertHtml = `<div class="insight" style="background:#e6f4ea; border-color:#34a853"><b>✅ Estrategia Rentable:</b> Este escenario aumenta tus ganancias en ${money(profitDiff)}.</div>`;
 }

 return `<div class="grid wide">
   <div class="card">
     <div class="card-head">
       <div>
         <h3>Simulador Econométrico</h3>
         <span class="muted">¿Qué pasaría si cambias tus precios? (Incluye Elasticidad)</span>
       </div>
       <select id="scenario-product">${db.products.map(x=>`<option value="${x.id}" ${x.id==p.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
     </div>
     <div class="field">
       <label>Variación del precio de venta: <b id="delta-label" style="color:var(--green)">${d>0?'+':''}${d}%</b></label>
       <input id="price-range" type="range" min="-30" max="30" step="1" value="${d}">
       <div style="display:flex;justify-content:space-between;color:var(--muted);font-size:11px"><span>-30%</span><span>Precio Actual</span><span>+30%</span></div>
     </div>
     
     <div class="grid g2" style="margin-top:20px">
        <div style="border:1px solid var(--line); padding:15px; border-radius:10px;">
           <span class="eyebrow">Escenario Actual (Base)</span>
           <div style="margin-top:10px; display:grid; gap:8px;">
             <div style="display:flex; justify-content:space-between"><span>Precio:</span> <b>${money(currentPrice)}</b></div>
             <div style="display:flex; justify-content:space-between"><span>Unidades (mes):</span> <b>${num(baseUnits)}</b></div>
             <div style="display:flex; justify-content:space-between"><span>Ingresos:</span> <b>${money(baseRev)}</b></div>
             <div style="display:flex; justify-content:space-between; color:var(--green); font-size:16px;"><span>Ganancia Neta:</span> <b>${money(baseProfit)}</b></div>
           </div>
        </div>
        <div style="border:1px solid ${profitDiff<0?'var(--red)':'var(--green)'}; padding:15px; border-radius:10px; background:${profitDiff<0?'#fff0ed':'#f3f8f6'}">
           <span class="eyebrow">Escenario Simulado</span>
           <div style="margin-top:10px; display:grid; gap:8px;">
             <div style="display:flex; justify-content:space-between"><span>Nuevo Precio:</span> <b>${money(newPrice)}</b></div>
             <div style="display:flex; justify-content:space-between"><span>Unidades est.:</span> <b>${num(simUnits)}</b></div>
             <div style="display:flex; justify-content:space-between"><span>Nuevos Ingresos:</span> <b>${money(simRev)}</b></div>
             <div style="display:flex; justify-content:space-between; color:${profitDiff<0?'var(--red)':'var(--green)'}; font-size:16px;"><span>Ganancia Neta:</span> <b>${money(simProfit)}</b></div>
           </div>
        </div>
     </div>
     <div style="margin-top:15px">${alertHtml}</div>
   </div>
   <div class="card">
     <h3>Impacto en Ganancias y Ventas</h3>
     <div class="chart-container">
        <canvas id="scenarioChart"></canvas>
     </div>
   </div>
 </div>`;
}

function landing(){document.getElementById('app').innerHTML=`<div class="content landing" style="max-width:1200px;margin:auto"><div class="logo" style="color:var(--navy)"><div class="logo-mark">E</div><div>Econométrica<small style="color:var(--green)">PYME</small></div></div><div class="hero"><div><span class="pill" style="background:rgba(255,255,255,.12);color:#fff">SaaS B2B · Perú</span><h2>Convierte los datos de tu negocio en decisiones más rentables.</h2><p>Ventas, costos, gastos, rentabilidad, escenarios y análisis de demanda en una sola plataforma.</p><div class="hero-actions"><button class="btn gold" data-action="enter">Explorar demo</button><button class="btn" data-action="modal-register">Crear cuenta</button></div></div><div class="hero-visual"><div class="mini-dash"><b>Panel ejecutivo</b><div class="mini-grid" style="margin-top:9px"><div class="mini-box"><small>Ventas</small><b>${money(totals().sales)}</b></div><div class="mini-box"><small>Margen bruto</small><b>${pct(totals().margin)}</b></div><div class="mini-box"><small>Productos</small><b>${db.products.length}</b></div></div></div></div></div><div class="grid g3">${['Analiza tus ventas','Descubre tus productos más rentables','Prueba escenarios de precio'].map((x,i)=>`<div class="card feature"><span class="pill">0${i+1}</span><b>${x}</b><span class="muted">${['Visualiza ingresos y evolución por periodo, producto y canal.','Compara ingresos, costos, márgenes y contribución.','Modifica precio, costo y volumen con supuestos visibles.'][i]}</span></div>`).join('')}</div><div class="steps">${['Registra tus datos','Importa o ingresa información','Analiza indicadores y gráficos','Toma decisiones con evidencia'].map((x,i)=>`<div class="step"><span>${i+1}</span><b>${x}</b><p class="muted">Flujo simple para una PYME.</p></div>`).join('')}</div></div>`}
function openModal(title,body){$('#modal-root').innerHTML=`<div class="modal"><div class="modal-card"><div class="modal-head"><div><span class="eyebrow">Econométrica PYME</span><h2>${title}</h2></div><button class="close" data-action="close">×</button></div><div style="margin-top:16px">${body}</div></div></div>`}

function afterRender(){
 $('#period')?.addEventListener('change',e=>{state.period=e.target.value;render()});
 $('#sales-search')?.addEventListener('input',e=>{state.search=e.target.value;render()});
 $('#sale-form')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);db.sales.push({id:Date.now(),date:f.get('date'),productId:+f.get('productId'),qty:+f.get('qty'),price:+f.get('price'),discount:+f.get('discount'),channel:f.get('channel'),customer:f.get('customer'),notes:f.get('notes')});save();toast('Venta registrada');render()});
 $('#expense-form')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);db.expenses.push({id:Date.now(),date:f.get('date'),desc:f.get('desc'),amount:+f.get('amount'),cat:f.get('cat'),type:f.get('type'),freq:f.get('freq'),product:''});save();toast('Gasto registrado');render()});
 $('#config-form')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);db.business={name:f.get('name'),sector:f.get('sector'),owner:f.get('owner'),email:f.get('email')};save();toast('Configuración guardada');shell()});
 $('#forecast-product')?.addEventListener('change',e=>{state.productId=+e.target.value;render()});
 $('#scenario-product')?.addEventListener('change',e=>{
    state.productId=+e.target.value;
    state.priceDelta=0; // reset delta when changing product
    render();
 });
 
 $('#price-range')?.addEventListener('input',e=>{
    state.priceDelta=+e.target.value;
    render(); // Re-render to update calculations and charts
 });
 
 if(state.screen === 'escenarios'){
    drawScenarioChart();
 }
}

function drawScenarioChart(){
    const ctx = document.getElementById('scenarioChart');
    if(!ctx) return;
    
    const p=product(state.productId)||db.products[0];
    const currentPrice = p.price;
    const currentCost = p.cost;
    const baseUnits = p.baseSales || db.sales.filter(s=>s.productId==p.id).reduce((a,s)=>a+s.qty,0) || 100;
    const elasticity = p.elasticity || -1.0;
    
    const d = Number(state.priceDelta||0);
    const newPrice = currentPrice * (1 + d/100);
    const demandChange = (d/100) * elasticity;
    let simUnits = Math.round(baseUnits * (1 + demandChange));
    if(simUnits < 0) simUnits = 0;
    
    const baseProfit = (currentPrice - currentCost) * baseUnits;
    const simProfit = (newPrice - currentCost) * simUnits;
    
    if(scenarioChart) {
        scenarioChart.destroy();
    }
    
    scenarioChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Base', 'Simulado'],
            datasets: [
                {
                    label: 'Ganancia Neta (S/)',
                    data: [baseProfit, simProfit],
                    backgroundColor: ['#dbe5e2', simProfit < 0 ? '#c74735' : (simProfit > baseProfit ? '#14a37f' : '#f2b233')],
                    borderRadius: 4
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true } }
        }
    });
}

document.addEventListener('click',e=>{
 const n=e.target.closest('[data-nav]');if(n){state.screen=n.dataset.nav;state.search='';shell();return}
 const del=e.target.closest('[data-delete-sale]');if(del){db.sales=db.sales.filter(x=>x.id!=del.dataset.deleteSale);save();render();toast('Venta eliminada');return}
 const de=e.target.closest('[data-delete-expense]');if(de){db.expenses=db.expenses.filter(x=>x.id!=de.dataset.deleteExpense);save();render();toast('Gasto eliminado');return}
 const edit=e.target.closest('[data-edit-product]');if(edit){const p=product(edit.dataset.editProduct);openModal('Editar producto',productForm(p));return}
 if(e.target.closest('[data-action="new-product"]')){openModal('Nuevo producto',productForm());return}
 if(e.target.closest('[data-action="import"]')){openModal('Importar CSV',`<p class="muted">Carga un CSV de ventas. La importación es local al navegador.</p><input id="csv-file" type="file" accept=".csv" style="margin:12px 0"><button class="btn primary" data-action="do-import">Validar e importar</button>`);return}
 if(e.target.closest('[data-action="do-import"]')){$('#csv-file')?.click();return}
 if(e.target.closest('[data-action="report"]')){state.screen='reportes';shell();setTimeout(()=>generateReport(),0);return}
 if(e.target.closest('[data-action="generate-report"]')){generateReport();return}
 if(e.target.closest('[data-action="print-report"]')){window.print();return}
 if(e.target.closest('[data-action="export-sales"]')){downloadCSV(db.sales.map(s=>({fecha:s.date,producto:product(s.productId)?.name||'',cantidad:s.qty,precio:s.price,descuento:s.discount,canal:s.channel})),'ventas.csv');return}
 if(e.target.closest('[data-action="export-expenses"]')){downloadCSV(db.expenses.map(x=>({fecha:x.date,descripcion:x.desc,importe:x.amount,categoria:x.cat,tipo:x.type,frecuencia:x.freq})),'gastos.csv');return}
 if(e.target.closest('[data-action="export-json"]')){downloadText(JSON.stringify(db,null,2),'econometrica-datos.json','application/json');return}
 if(e.target.closest('[data-action="download-template"]')){
     const csvContent = "Fecha,Producto,Cantidad,Precio,Descuento,Canal\n2026-10-01,Producto Ejemplo,2,50.00,0,Tienda";
     downloadText(csvContent, 'Plantilla_Ventas_Econometrica.csv', 'text/csv');
     toast('Plantilla descargada');
     return;
 }
 if(e.target.closest('[data-action="reset"]')){if(confirm('¿Restablecer los datos de demostración?')){localStorage.removeItem(KEY);location.reload()}return}
 if(e.target.closest('[data-action="landing"]')){landing();return}
 if(e.target.closest('[data-action="enter"]')){state.screen='inicio';shell();return}
 if(e.target.closest('[data-action="modal-register"]')){openModal('Crear cuenta',`<form id="register-form" class="form-grid"><div class="field"><label>Nombre del negocio</label><input name="name" required></div><div class="field"><label>Sector</label><select name="sector"><option>Comercio minorista</option><option>Restaurantes y alimentos</option><option>Ropa y accesorios</option><option>Distribución</option><option>Manufactura</option><option>Servicios</option><option>Otros</option></select></div><div class="field"><label>Responsable</label><input name="owner" required></div><div class="field"><label>Correo</label><input name="email" type="email" required></div><div class="field full"><button class="btn primary">Crear cuenta de demostración</button></div></form>`);return}
 if(e.target.closest('[data-action="close"]')){$('#modal-root').innerHTML='';return}
 const plan=e.target.closest('[data-plan]');if(plan){toast('Selección simulada: '+plan.dataset.plan);return}
});
document.addEventListener('submit',e=>{
 if(e.target.id==='register-form'){e.preventDefault();const f=new FormData(e.target);db.business={name:f.get('name'),sector:f.get('sector'),owner:f.get('owner'),email:f.get('email')};db.settings={demo:true};save();$('#modal-root').innerHTML='';state.screen='inicio';shell();toast('Cuenta de demostración creada')}
 if(e.target.id==='product-form'){e.preventDefault();const f=new FormData(e.target);const id=+f.get('id')||Date.now();const p={id,name:f.get('name'),sku:f.get('sku'),cat:f.get('cat'),price:+f.get('price'),cost:+f.get('cost'),stock:+f.get('stock'),status:f.get('status')};const i=db.products.findIndex(x=>x.id===id);if(i>=0)db.products[i]=p;else db.products.push(p);save();$('#modal-root').innerHTML='';render();toast('Producto guardado')}
});
document.addEventListener('change',e=>{
 if(e.target.id==='csv-file'&&e.target.files[0]) importCSV(e.target.files[0]);
});
function productForm(p={}){return `<form id="product-form" class="form-grid"><input type="hidden" name="id" value="${p.id||''}"><div class="field"><label>Nombre</label><input name="name" value="${esc(p.name||'')}" required></div><div class="field"><label>SKU</label><input name="sku" value="${esc(p.sku||'')}"></div><div class="field"><label>Categoría</label><input name="cat" value="${esc(p.cat||'Ropa')}" required></div><div class="field"><label>Precio de venta (S/)</label><input name="price" type="number" step=".01" value="${p.price||0}" required></div><div class="field"><label>Costo unitario (S/)</label><input name="cost" type="number" step=".01" value="${p.cost||0}" required></div><div class="field"><label>Stock</label><input name="stock" type="number" value="${p.stock||0}" required></div><div class="field"><label>Estado</label><select name="status"><option ${p.status==='Activo'?'selected':''}>Activo</option><option ${p.status==='Inactivo'?'selected':''}>Inactivo</option></select></div><div class="field full"><button class="btn primary">Guardar producto</button></div></form>`}
function generateReport(){const t=totals(), top=db.products.map(p=>{const ss=db.sales.filter(s=>s.productId==p.id),u=ss.reduce((a,s)=>a+s.qty,0),r=ss.reduce((a,s)=>a+s.qty*s.price-(s.discount||0),0),g=r-u*p.cost;return{p,u,r,g}}).sort((a,b)=>b.g-a.g);state.report=[`Resumen ejecutivo: ventas netas ${money(t.sales)}, costos de productos ${money(t.cogs)}, gastos registrados ${money(t.exp)} y utilidad bruta ${money(t.gross)}.`,top[0]?`Producto con mayor contribución bruta estimada: ${esc(top[0].p.name)} con ${money(top[0].g)}.`:'No hay productos con ventas suficientes para comparar.',t.margin<.3?`El margen bruto calculado es ${pct(t.margin)}; conviene revisar precios y costos unitarios.`:`El margen bruto calculado es ${pct(t.margin)}.`,db.expenses.length?`La categoría de gasto con mayor concentración es ${Object.entries(db.expenses.reduce((a,e)=>(a[e.cat]=(a[e.cat]||0)+e.amount,a),{})).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—'}.`:'No hay gastos registrados.',`Nota metodológica: estos cálculos distinguen utilidad bruta de resultado operativo y no constituyen una predicción ni una garantía.`];render()}
function importCSV(file){const r=new FileReader();r.onload=()=>{const lines=r.result.split(/\r?\n/).filter(Boolean);if(lines.length<2){toast('CSV vacío o inválido');return}const h=lines[0].split(',').map(x=>x.trim().toLowerCase());let ok=0;for(const line of lines.slice(1)){const c=line.split(',');const o={};h.forEach((k,i)=>o[k]=c[i]?.trim()||'');const p=db.products.find(x=>x.name.toLowerCase()===o.producto?.toLowerCase());if(!p||!o.fecha||!o.cantidad||!o.precio)continue;db.sales.push({id:Date.now()+ok,date:o.fecha,productId:p.id,qty:+o.cantidad,price:+o.precio,discount:+o.descuento||0,channel:o.canal||'Otro',customer:'',notes:''});ok++}save();$('#modal-root').innerHTML='';render();toast(`${ok} registros importados`) };r.readAsText(file)}
function downloadCSV(rows,name){const h=Object.keys(rows[0]||{});const csv=[h.join(','),...rows.map(r=>h.map(k=>`"${String(r[k]??'').replaceAll('"','""')}"`).join(','))].join('\n');downloadText(csv,name,'text/csv')}
function downloadText(txt,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}

function switchDemoBusiness(key){
  if(!DEMO_BUSINESSES[key]) return;
  db = buildDemoState(key);
  save();
  state.productId = db.products[0]?.id || 1;
  state.priceDelta = 0;
  shell();
  toast('Demo cargada: '+DEMO_BUSINESSES[key].business.name);
  window.scrollTo({top:0,behavior:'smooth'});
}

landing();
</script>
